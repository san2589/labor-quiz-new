<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPAS / 採購班模擬考 - 手機優化版</title>
    <style>
        :root { --bg:#0f172a; --card:#1e293b; --brand:#2dd4bf; --text:#f1f5f9; }
        body { background:var(--bg); color:var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin:0; padding:15px; line-height:1.5; }
        .wrap { max-width:800px; margin:0 auto; }
        .card { background:var(--card); padding:20px; border-radius:16px; border:1px solid #334155; margin-bottom:15px; }
        
        /* 標題與狀態資訊 */
        h2 { color:var(--brand); margin:0 0 10px 0; font-size: 1.5rem; }
        .status-msg { font-size: 16px; color: #94a3b8; margin-bottom: 10px; }

        /* 選單與按鈕 */
        .quiz-type-selector { margin: 15px 0; }
        .quiz-type-selector label { font-weight: bold; font-size: 16px; display: block; margin-bottom: 8px; color: var(--brand); }
        .quiz-type-selector select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; font-size: 16px; background-color: #0f172a; color: #fff; outline: none; }
        .btn { background:#334155; color:white; border:none; padding:12px 15px; border-radius:10px; cursor:pointer; font-weight:bold; font-size: 16px; }
        .btn-active { background:var(--brand) !important; color:#0f172a !important; }
        .btn-primary { background:var(--brand); color:#0f172a; width: 100%; margin-top: 15px; font-size: 20px; padding: 15px; }
        
        /* 題目顯示加強 */
        h3 { font-size: 1.3rem; line-height: 1.4; margin-top: 5px; color: #fff; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        
        /* 選項按鈕加強 */
        .opt { width:100%; text-align:left; padding:18px; background:#0f172a; border:2px solid #334155; color:white; border-radius:12px; margin-bottom:12px; cursor:pointer; font-size: 18px; font-weight: 500; }
        .opt.selected { border-color:var(--brand); background:rgba(45,212,191,0.1); }
        .opt.correct { background:rgba(34,197,94,0.3) !important; border-color:#22c55e !important; color:#4ade80; }
        .opt.wrong { background:rgba(251,113,133,0.3) !important; border-color:#fb7185 !important; color:#fda4af; }
        
        /* 題號網格 */
        .nav-grid { display:grid; grid-template-columns: repeat(5, 1fr); gap:10px; margin-top:10px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .dot { background:#0f172a; border:1px solid #334155; text-align:center; padding:12px 0; border-radius:8px; cursor:pointer; font-size:16px; font-weight: bold; }
        .dot.active { border-color:var(--brand); color:var(--brand); border-width: 2px; }
        .dot.score-correct { background:#065f46 !important; border-color:#10b981 !important; color:white; }
        .dot.score-wrong { background:#7f1d1d !important; border-color:#ef4444 !important; color:white; }
        .dot.done { background:#475569; }

        /* 解析盒 */
        .exp-box { padding:15px; background:rgba(45,212,191,0.1); border-left:5px solid var(--brand); margin-top:20px; border-radius:8px; font-size: 17px; }
        
        /* 分數看板 */
        .result-header { text-align: center; padding: 25px; background: rgba(45,212,191,0.1); border-radius: 16px; margin-bottom: 15px; border: 2px solid var(--brand); }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card" id="setupBox">
        <h2>iPAS / 採購班模擬考系統</h2>
        
        <!-- 題型選擇器 -->
        <div class="quiz-type-selector">
            <label for="quizTypeSelect">🎯 請選擇題型類別：</label>
            <select id="quizTypeSelect">
                <option value="all">🔘 全部題型 (是非 + 選擇)</option>
                <option value="choice">🔘 選擇題專區</option>
                <option value="tf">🔘 是非題專區</option>
            </select>
        </div>

        <!-- 題數與模式選擇器 -->
        <div class="quiz-type-selector">
            <label for="quizCountSelect">🔢 請選擇測驗題數/模式：</label>
            <select id="quizCountSelect">
                <option value="procurement_std" selected>🏛️ 採購班標準考 (66題是非 + 132題選擇，滿分330分)</option>
                <option value="all">🔥 [全部題目] 完整刷一遍</option>
                <option value="50">⚡ 隨機 50 題</option>
                <option value="100">⚡ 隨機 100 題</option>
            </select>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
            <button class="btn btn-active" onclick="fetchAndParse('labor_questions.json')">載入勞動法規 (labor_questions.json)</button>
            <button class="btn btn-active" onclick="fetchAndParse('ipas_questions_ai.json')">載入 AI 規劃師</button>
            <button class="btn btn-active" onclick="fetchAndParse('ipas_questions_all.json')">載入全部題庫</button>
        </div>
        <div id="status" class="status-msg" style="margin-top:15px;">請選擇題庫載入練習</div>
    </div>

    <div id="quizBox" style="display:none;">
        <div id="scoreBoard" class="result-header" style="display:none;">
            <div style="font-size: 1.3rem;">測驗結束</div>
            <div style="font-size: 3rem; font-weight: bold; color: var(--brand);" id="finalScoreText">0</div>
            <div id="scoreDetailText" style="font-size: 18px;">答對：0 題 | 答錯：0 題</div>
            <button class="btn" style="margin-top:15px; background:var(--brand); color:#000; width:80%;" onclick="location.reload()">重新測驗</button>
        </div>

        <div class="card">
            <div id="qArea"></div>
            <div style="display:flex; justify-content:space-between; margin-top:20px; gap:10px;">
                <button class="btn" style="flex:1" onclick="move(-1)">← 上一題</button>
                <button class="btn" style="flex:1" onclick="revealed[current]=true;render()">看解析</button>
                <button class="btn" style="flex:1" onclick="move(1)">下一題 →</button>
            </div>
            <button class="btn btn-primary" id="finishBtn" onclick="submitExam()">送出交卷</button>
        </div>

        <div class="card">
            <div style="margin-bottom:12px; font-weight:bold; font-size: 18px;">題目導覽 (紅綠燈檢討)</div>
            <div id="navGrid" class="nav-grid"></div>
        </div>
    </div>
</div>

<script>
let bank = [], current = 0, answers = {}, revealed = {}, isFinished = false;

async function fetchAndParse(name) {
    document.getElementById('status').textContent = "讀取中，請稍候...";
    try {
        const res = await fetch(name + "?v=" + Date.now());
        const data = await res.json();
        
        let rawList = Array.isArray(data) ? data : (data.questions || []);
        let temp = [];

        rawList.forEach(raw => {
            let qText = raw.question || raw.q;
            if (!qText) return;

            let opts = [];
            if (Array.isArray(raw.options)) {
                opts = raw.options;
            } else if (Array.isArray(raw.a)) {
                opts = raw.a;
            } else if (raw.A || raw.B) {
                opts = [raw.A, raw.B, raw.C, raw.D].filter(Boolean);
            }

            let exp = raw.analysis || raw.explanation || raw.e || "無解析";
            let rawAns = raw.answer !== undefined ? raw.answer : raw.c;
            let ans = -1;

            // 1. 先嘗試從解析文字（例如："答案為 (1) 是"）精準判斷正確選項
            if (exp) {
                let match = exp.match(/答案為\s*\(?([1-4A-Da-d])\)?/);
                if (match) {
                    let aStr = match[1].toUpperCase();
                    if (!isNaN(aStr)) ans = parseInt(aStr, 10) - 1;
                    else if (["A","B","C","D"].includes(aStr)) ans = {"A":0,"B":1,"C":2,"D":3}[aStr];
                }
            }

            // 2. 如果解析沒寫出答案，再依 rawAns 做邏輯轉換 (處理 1-based vs 0-based)
            if (ans === -1 && rawAns !== undefined && rawAns !== null) {
                if (typeof rawAns === 'number') {
                    // 如果數字大於等於 1 且小於等於選項數，代表是 1-based，需減 1
                    ans = (rawAns >= 1 && rawAns <= opts.length) ? rawAns - 1 : rawAns;
                } else if (typeof rawAns === 'string') {
                    let upper = rawAns.trim().toUpperCase();
                    if (!isNaN(upper)) {
                        let parsedNum = parseInt(upper, 10);
                        ans = (parsedNum >= 1 && parsedNum <= opts.length) ? parsedNum - 1 : parsedNum;
                    } else if (["A", "B", "C", "D"].includes(upper)) {
                        ans = {"A":0, "B":1, "C":2, "D":3}[upper];
                    }
                }
            }

            let type = raw.type;
            if (!type) {
                type = (opts.length === 2) ? 'tf' : 'choice';
            }

            if (qText && opts.length >= 2 && ans >= 0 && ans < opts.length) {
                temp.push({ q: qText, opts: opts, ans: ans, exp: exp, type: type });
            }
        });

        const countMode = document.getElementById('quizCountSelect').value;

        if (countMode === 'procurement_std') {
            // 🏛️ 採購班標準模式：66 題是非題 + 132 題選擇題
            let tfList = temp.filter(item => item.type === 'tf').sort(() => Math.random() - 0.5);
            let choiceList = temp.filter(item => item.type === 'choice').sort(() => Math.random() - 0.5);

            let selectedTF = tfList.slice(0, 66);
            let selectedChoice = choiceList.slice(0, 132);

            bank = [...selectedTF, ...selectedChoice];

            if (bank.length === 0) {
                alert("題庫中沒有找到有效的題目！");
                document.getElementById('status').textContent = "請選擇其他題庫";
                return;
            }

            if (selectedTF.length < 66 || selectedChoice.length < 132) {
                alert(`提醒：現有題庫數量不足（是非題 ${selectedTF.length}/66 題，選擇題 ${selectedChoice.length}/132 題），已載入最大可用題數！`);
            }
        } else {
            const selectedType = document.getElementById('quizTypeSelect').value;
            let filtered = temp.filter(item => {
                switch (selectedType) {
                    case 'choice': return item.type === 'choice';
                    case 'tf': return item.type === 'tf';
                    case 'all': default: return true;
                }
            });

            if (filtered.length === 0) {
                alert("題庫解析成功，但選取的類型無可用題目！");
                document.getElementById('status').textContent = "請選擇其他題庫或類型";
                return;
            }

            if (countMode === 'all') {
                bank = filtered;
            } else {
                const maxCount = parseInt(countMode, 10);
                bank = filtered.sort(() => Math.random() - 0.5).slice(0, maxCount);
            }
        }

        current = 0; answers = {}; revealed = {}; isFinished = false;
        document.getElementById('setupBox').style.display = "none";
        document.getElementById('quizBox').style.display = "block";
        render();
    } catch (e) { alert("讀取錯誤: " + e.message); }
}

function render() {
    if (bank.length === 0) return;
    const item = bank[current];
    const showResult = isFinished || revealed[current];
    const typeLabel = item.type === 'tf' ? '[是非題]' : '[選擇題]';
    let html = `<h3>Q${current + 1}. <span style="color:var(--brand);">${typeLabel}</span> ${item.q}</h3>`;

    item.opts.forEach((opt, i) => {
        let cls = "opt";
        if (answers[current] === i) cls += " selected";
        if (showResult) {
            if (i === item.ans) cls += " correct";
            else if (answers[current] === i) cls += " wrong";
        }
        html += `<button class="${cls}" onclick="selectOpt(${i})">${opt}</button>`;
    });

    if (showResult) html += `<div class="exp-box"><b>💡 解析：</b><br>${item.exp}</div>`;
    document.getElementById('qArea').innerHTML = html;
    
    document.getElementById('navGrid').innerHTML = bank.map((it, i) => {
        let cls = "dot";
        if (i === current) cls += " active";
        if (isFinished) {
            cls += (answers[i] === it.ans) ? " score-correct" : " score-wrong";
        } else if (answers[i] !== undefined) {
            cls += " done";
        }
        return `<div class="${cls}" onclick="current=${i};render()">${i+1}</div>`;
    }).join('');
    window.scrollTo(0, 0);
}

function selectOpt(i) {
    if (isFinished) return;
    answers[current] = i;
    render();
}

function move(step) {
    let next = current + step;
    if (next >= 0 && next < bank.length) { current = next; render(); }
}

function submitExam() {
    if (!confirm("確定交卷嗎？")) return;
    isFinished = true;
    
    let correctCount = 0;
    let totalScore = 0;
    let maxPossibleScore = 0;

    const countMode = document.getElementById('quizCountSelect').value;

    bank.forEach((it, i) => {
        const isCorrect = (answers[i] === it.ans);
        if (isCorrect) correctCount++;

        // 採購班標準計分法 (是非題 1 分，選擇題 2 分)
        if (countMode === 'procurement_std') {
            const point = (it.type === 'tf') ? 1 : 2;
            maxPossibleScore += point;
            if (isCorrect) totalScore += point;
        }
    });

    document.getElementById('scoreBoard').style.display = "block";
    
    if (countMode === 'procurement_std') {
        const isPass = totalScore >= 231;
        document.getElementById('finalScoreText').innerHTML = `${totalScore} <span style="font-size:1.5rem; color:#fff;">/ ${maxPossibleScore} 分</span><br><span style="font-size:1.2rem; color:${isPass ? '#4ade80' : '#fb7185'};">${isPass ? '🎉 及格 (達 231 分門檻)' : '❌ 未及格 (需達 231 分)'}</span>`;
    } else {
        const percentage = Math.round((correctCount / bank.length) * 100);
        document.getElementById('finalScoreText').textContent = percentage + " 分";
    }

    document.getElementById('scoreDetailText').textContent = `答對：${correctCount} 題 | 答錯：${bank.length - correctCount} 題 (總題數：${bank.length} 題)`;
    document.getElementById('finishBtn').style.display = "none";
    current = 0;
    render();
}
</script>
</body>
</html>
